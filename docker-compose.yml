services:

  # =====================================================
  # PostgreSQL + pgvector
  # Database chính của hệ thống
  # =====================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms-rag-postgres

    # Tự khởi động lại nếu container bị lỗi.
    # Nếu developer chủ động "docker stop"
    # thì sẽ không tự bật lại sau khi restart Docker Desktop.
    restart: unless-stopped

    environment:
      # Database name
      POSTGRES_DB: ${DB_NAME}

      # Database username
      POSTGRES_USER: ${DB_USERNAME}

      # Database password
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      # Port máy thật : Port container
      - "${DB_PORT}:5432"

    volumes:
      # Lưu dữ liệu PostgreSQL
      # Xóa container không làm mất database
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      # Dùng psql thực sự execute query để đảm bảo Postgres hoàn toàn sẵn sàng,
      # bao gồm cả xác thực mật khẩu - chính xác hơn pg_isready.
      # start_period: cho Postgres thêm thời gian khởi động sau khi server reboot
      # trước khi bắt đầu đếm retries.
      test: [ "CMD-SHELL", "psql -U ${DB_USERNAME} -d ${DB_NAME} -c 'SELECT 1' -q --no-psqlrc" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - lms-network


  # =====================================================
  # Spring Boot Backend
  # =====================================================
  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lms-rag-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # ========= Database =========
      # Trong Docker, backend truy cập database
      # thông qua tên service "postgres"
      DB_HOST: postgres
      DB_PORT: 5432

      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # ========= JWT =========
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-2592000000}

      # ========= Storage =========
      UPLOAD_ROOT: /storage/uploads

      # ========= AI Service =========
      AI_SERVICE_BASE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

      # ========= Mail =========
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}

      # ========= Spring =========
      SPRING_PROFILES_ACTIVE: docker

      # Bound the JVM heap so Backend cannot starve the other services.
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      SERVER_MAX_THREADS: ${SERVER_MAX_THREADS:-50}
      SERVER_MIN_SPARE_THREADS: ${SERVER_MIN_SPARE_THREADS:-2}
      DOCUMENT_LOG_LEVEL: ${DOCUMENT_LOG_LEVEL:-INFO}

      # ========= CORS =========
      # Cần bao gồm URL public của frontend khi triển khai thực tế,
      # ví dụ: http://14.225.172.55:5173
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4200}

    ports:
      # Truy cập API
      - "8081:8080"

    # Runtime guardrails; override in .env after load testing.
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}

    volumes:
      # Shared storage với AI Service
      - uploads:/storage/uploads

    networks:
      - lms-network


  # =====================================================
  # Frontend (React + Vite)
  # http://localhost:5173
  # =====================================================
  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: lms-rag-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    ports:
      - "5173:80"

    networks:
      - lms-network


  # =====================================================
  # AI Service
  # =====================================================
  ai-service:

    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: lms-rag-ai-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_ENV: docker
      APP_NAME: LMS RAG AI Service
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_CONNECT_TIMEOUT: 5
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      UPLOAD_ROOT: /storage/uploads
      MAX_FILE_SIZE_MB: 20
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o-mini}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_RETRY_BASE_DELAY_SECONDS: ${EMBEDDING_RETRY_BASE_DELAY_SECONDS:-0.5}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30}
      GENERATION_MAX_RETRIES: ${GENERATION_MAX_RETRIES:-2}
      GENERATION_RETRY_BASE_DELAY_SECONDS: ${GENERATION_RETRY_BASE_DELAY_SECONDS:-0.5}
      GENERATION_REQUEST_TIMEOUT_SECONDS: ${GENERATION_REQUEST_TIMEOUT_SECONDS:-30}
      GENERATION_DEFAULT_MAX_TOKENS: ${GENERATION_DEFAULT_MAX_TOKENS:-700}
      GENERATION_SUMMARY_MAX_TOKENS: ${GENERATION_SUMMARY_MAX_TOKENS:-1200}
      GENERATION_QUIZ_MAX_TOKENS: ${GENERATION_QUIZ_MAX_TOKENS:-6000}
      QUIZ_CONTEXT_CHUNKS: ${QUIZ_CONTEXT_CHUNKS:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    ports:
      - "8000:8000"

    volumes:
      # Đọc file từ shared storage (read-only)
      - uploads:/storage/uploads:ro

    networks:
      - lms-network


  # =====================================================
  # pgAdmin
  # Web UI quản lý PostgreSQL
  # http://localhost:5050
  # =====================================================
  pgadmin:

    image: dpage/pgadmin4
    container_name: lms-rag-pgadmin

    # Development/operations tool. Start explicitly with:
    # docker compose --profile tools up -d pgadmin
    profiles: [ "tools" ]

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    mem_limit: ${PGADMIN_MEMORY_LIMIT:-512m}
    cpus: ${PGADMIN_CPU_LIMIT:-0.5}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # Lưu cấu hình pgAdmin
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - lms-network


# =====================================================
# Docker Network
# Tất cả service trong project sẽ giao tiếp qua network này
# =====================================================
networks:
  lms-network:
    driver: bridge


# =====================================================
# Docker Volumes
# =====================================================
volumes:

  # Lưu dữ liệu PostgreSQL
  pgdata:

  # Lưu cấu hình pgAdmin
  pgadmin_data:

  # Shared storage giữa Backend và AI Service
  uploads:

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cho phép upload file lớn nhất 20MB (khớp với giới hạn Backend)
    client_max_body_size 20M;

    # Compress frontend bundles over the public network. PDF responses are
    # intentionally excluded so HTTP byte ranges keep their original offsets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite assets contain a content hash in their filename, so they can be
    # cached permanently. A new deployment automatically produces a new URL.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PDF.js ships its worker as an ES module. Some Alpine Nginx mime maps do
    # not include .mjs, causing browsers to reject it as application/octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the SPA entry point so it never references stale asset
    # hashes after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: mọi route không khớp file tĩnh đều về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stream document responses directly so PDF.js can request byte ranges
    # without Nginx buffering the complete upstream response first.
    location ~ ^/api/v1/documents/[0-9]+/(content|download)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Proxy các API call đến backend service trong Docker network
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

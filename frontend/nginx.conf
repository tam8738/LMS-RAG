server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cho phép upload file lớn nhất 20MB (khớp với giới hạn Backend)
    client_max_body_size 20M;

    # PDF.js ships its worker as an ES module. Some Alpine Nginx mime maps do
    # not include .mjs, causing browsers to reject it as application/octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # SPA fallback: mọi route không khớp file tĩnh đều về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stream document responses directly so PDF.js can request byte ranges
    # without Nginx buffering the complete upstream response first.
    location ~ ^/api/v1/documents/[0-9]+/(content|download)$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Proxy các API call đến backend service trong Docker network
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

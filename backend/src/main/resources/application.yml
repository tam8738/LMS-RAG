security:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# CORS configuration for frontend communication
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

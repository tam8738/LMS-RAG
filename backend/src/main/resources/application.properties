spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:lms_rag}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

#spring.datasource.url=jdbc:postgresql://localhost:5432/lms_rag
#spring.datasource.username=postgres
#spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate no longer manages schema; Flyway migrations are the source of truth.
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baseline an existing non-empty schema so migrations can be applied on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

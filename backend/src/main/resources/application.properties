spring.application.name=backend
spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:lms_rag}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

#spring.datasource.url=jdbc:postgresql://localhost:5432/lms_rag
#spring.datasource.username=postgres
#spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Small-deployment defaults; override these variables for larger installations.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# The instance admits at most two expensive AI calls concurrently. Keep the
# servlet pool compact while retaining headroom for ordinary API traffic.
server.tomcat.threads.max=${SERVER_MAX_THREADS:50}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:2}

# Hibernate no longer manages schema; Flyway migrations are the source of truth.
spring.jpa.hibernate.ddl-auto=validate

# Never allow clients to turn a paginated endpoint back into an unbounded response.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baseline an existing non-empty schema so migrations can be applied on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# File upload configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Storage configuration
app.storage.upload-root=${UPLOAD_ROOT:./uploads}

# AI Service internal REST configuration
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${INTERNAL_API_KEY:}

# Protect expensive synchronous AI endpoints. These limits apply per Backend instance.
app.ai-guard.requests-per-window=${AI_RATE_LIMIT_REQUESTS:10}
app.ai-guard.window=${AI_RATE_LIMIT_WINDOW:PT1M}
app.ai-guard.max-concurrent-requests=${AI_MAX_CONCURRENT_REQUESTS:2}
app.ai-guard.bulkhead-wait=${AI_BULKHEAD_WAIT:PT0S}

# SMTP account used for asynchronous account notifications.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
spring.mail.test-connection=false
app.mail.from=${MAIL_FROM:no-reply@lms.edu.vn}

# Logging configuration with detailed timestamp
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS z} | %-5level | [%thread] | %logger{40} | %msg%n
logging.level.com.lmsrag.backend.service.DocumentService=${DOCUMENT_LOG_LEVEL:INFO}
logging.level.com.lmsrag.backend.service.StorageService=${DOCUMENT_LOG_LEVEL:INFO}
logging.level.com.lmsrag.backend.controller.DocumentController=${DOCUMENT_LOG_LEVEL:INFO}

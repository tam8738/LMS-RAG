spring.application.name=backend
spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:lms_rag}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

#spring.datasource.url=jdbc:postgresql://localhost:5432/lms_rag
#spring.datasource.username=postgres
#spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate no longer manages schema; Flyway migrations are the source of truth.
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Baseline an existing non-empty schema so migrations can be applied on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# File upload configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Storage configuration
app.storage.upload-root=${UPLOAD_ROOT:./uploads}

# AI Service internal REST configuration
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${INTERNAL_API_KEY:}

# SMTP account used for asynchronous account notifications.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
spring.mail.test-connection=false
app.mail.from=${MAIL_FROM:no-reply@lms.edu.vn}

# Logging configuration with detailed timestamp
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS z} | %-5level | [%thread] | %logger{40} | %msg%n
logging.level.com.lmsrag.backend.service.DocumentService=DEBUG
logging.level.com.lmsrag.backend.service.StorageService=DEBUG
logging.level.com.lmsrag.backend.controller.DocumentController=DEBUG
